name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run invariantforge check --format json
        if: github.event_name == 'push'
      - run: uv run invariantforge check --format json --baseline-ref ${{ github.event.pull_request.base.sha }}
        if: github.event_name == 'pull_request'
      - run: uv build
